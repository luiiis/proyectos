version: '3.9'

# ════════════════════════════════════════════════════════════════
# Docker Compose - Entorno Completo de Aprendizaje de BD
# Levanta: PostgreSQL + MySQL + Oracle XE + PgAdmin + Adminer
# Comando: docker compose up -d
# ════════════════════════════════════════════════════════════════

services:

  # ═══════════════════════════════════════
  # PostgreSQL 16
  # ═══════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: learn-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: empresa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./19-docker/init/postgres:/docker-entrypoint-initdb.d
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ═══════════════════════════════════════
  # MySQL 8
  # ═══════════════════════════════════════
  mysql:
    image: mysql:8.0
    container_name: learn-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql123
      MYSQL_DATABASE: empresa_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./19-docker/init/mysql:/docker-entrypoint-initdb.d
    networks:
      - db-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ═══════════════════════════════════════
  # Oracle XE 21c
  # ═══════════════════════════════════════
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: learn-oracle
    environment:
      ORACLE_PASSWORD: oracle123
      APP_USER: empresa_user
      APP_USER_PASSWORD: empresa123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./19-docker/init/oracle:/container-entrypoint-initdb.d
    networks:
      - db-network
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10

  # ═══════════════════════════════════════
  # PgAdmin 4 (GUI para PostgreSQL)
  # ═══════════════════════════════════════
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: learn-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - db-network

  # ═══════════════════════════════════════
  # Adminer (GUI universal para MySQL/PostgreSQL/Oracle)
  # ═══════════════════════════════════════
  adminer:
    image: adminer:latest
    container_name: learn-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - mysql
    networks:
      - db-network

volumes:
  postgres_data:
  mysql_data:
  oracle_data:

networks:
  db-network:
    driver: bridge
