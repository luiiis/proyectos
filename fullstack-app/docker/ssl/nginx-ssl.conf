# ============================================================
# Nginx con SSL/TLS (HTTPS) usando Let's Encrypt
# ============================================================
#
# ¿Qué es SSL/TLS?
# - Protocolo que encripta la comunicación entre el navegador y el servidor.
# - Sin SSL: los datos viajan en texto plano (cualquiera puede leerlos).
# - Con SSL: los datos van encriptados (solo el servidor puede descifrarlos).
# - El candadito verde en el navegador = conexión SSL activa.
#
# ¿Qué es Let's Encrypt?
# - Autoridad certificadora GRATUITA y automática.
# - Emite certificados SSL válidos por 90 días.
# - Se renuevan automáticamente con Certbot.
#
# ¿Cómo funciona?
# 1. Certbot solicita un certificado a Let's Encrypt.
# 2. Let's Encrypt verifica que controlas el dominio (challenge HTTP).
# 3. Si pasa la verificación, emite el certificado.
# 4. Nginx usa ese certificado para servir HTTPS.
#

# Redirigir HTTP → HTTPS
server {
    listen 80;
    server_name tudominio.com www.tudominio.com;

    # Let's Encrypt challenge (necesario para renovar certificados)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → redirigir a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS
server {
    listen 443 ssl http2;
    server_name tudominio.com www.tudominio.com;

    # Certificados SSL (generados por Certbot)
    ssl_certificate /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;

    # Configuración SSL segura
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Frontend Angular
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend Auth API
    location /api/ {
        proxy_pass http://backend-auth:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend Mail API
    location /api/mail/ {
        proxy_pass http://backend-mail:8081/api/mail/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets estáticos con cache largo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
