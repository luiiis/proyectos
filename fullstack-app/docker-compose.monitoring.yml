# ============================================================
# Docker Compose - Servicios de Monitoreo y Caché
# ============================================================
#
# Este archivo EXTIENDE el docker-compose.yml principal.
# Se usa con: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Servicios adicionales:
# - Redis: Caché en memoria (sesiones, rate limiting)
# - Prometheus: Recolección de métricas
# - Grafana: Dashboards visuales de monitoreo
#

version: '3.8'

services:

  # ==================== REDIS ====================
  # Base de datos en memoria para caché y sesiones
  redis:
    image: redis:7-alpine
    container_name: fullstack-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    # Configuración: máximo 256MB de memoria, política de evicción LRU
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==================== PROMETHEUS ====================
  # Recolector de métricas
  # Acceso: http://localhost:9090
  prometheus:
    image: prom/prometheus:latest
    container_name: fullstack-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - app-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'  # Retener métricas 30 días

  # ==================== GRAFANA ====================
  # Dashboards de monitoreo
  # Acceso: http://localhost:3000 (admin/admin)
  grafana:
    image: grafana/grafana:latest
    container_name: fullstack-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - app-network

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    external: true
    name: fullstack-app_app-network
