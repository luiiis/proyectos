# ============================================================
# Kubernetes - Secrets
# ============================================================
#
# ¿Qué es un Secret?
# - Almacena datos sensibles (passwords, tokens, claves).
# - Se inyectan como variables de entorno en los pods.
# - Están codificados en base64 (NO encriptados por defecto).
# - En producción: usar Sealed Secrets o Vault para encriptación real.
#
# Para generar valores en base64:
#   echo -n "miPassword" | base64
#
# Comando: kubectl apply -f secrets.yml -n fullstack-app
#
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: fullstack-app
type: Opaque
data:
  # echo -n "rootPassword123!" | base64
  mysql-root-password: cm9vdFBhc3N3b3JkMTIzIQ==
  # echo -n "productsPass123!" | base64
  oracle-password: cHJvZHVjdHNQYXNzMTIzIQ==
  # echo -n "SqlServer123!" | base64
  sqlserver-password: U3FsU2VydmVyMTIzIQ==
  # echo -n "myJWTSecretKey..." | base64
  jwt-secret: bXlTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb25NdXN0QmUyNTZCaXRzTG9uZyEh
