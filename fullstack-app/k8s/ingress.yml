# ============================================================
# Kubernetes - Ingress (Punto de entrada desde Internet)
# ============================================================
#
# ¿Qué es un Ingress?
# - Es el "puerta de entrada" desde Internet hacia tu cluster.
# - Funciona como un reverse proxy (similar a Nginx en Docker Compose).
# - Enruta tráfico basado en el path de la URL.
# - Puede manejar SSL/TLS (HTTPS).
#
# Flujo:
# Internet → Ingress → Service → Pod(s)
#
# Con este Ingress:
# - tudominio.com/ → frontend
# - tudominio.com/api/ → backend-auth
# - tudominio.com/api/mail/ → backend-mail
#
# Requisito: Tener un Ingress Controller instalado (nginx-ingress, traefik, etc.)
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fullstack-ingress
  namespace: fullstack-app
  annotations:
    # Usar nginx como ingress controller
    kubernetes.io/ingress.class: nginx
    # Habilitar SSL con Let's Encrypt (cert-manager)
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Rate limiting a nivel de ingress
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  # Configuración TLS (HTTPS)
  tls:
    - hosts:
        - tudominio.com
      secretName: fullstack-tls  # Certificado SSL almacenado como Secret
  rules:
    - host: tudominio.com  # Cambiar por tu dominio real
      http:
        paths:
          # API de autenticación y productos
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: backend-auth-service
                port:
                  number: 8080
          # API de correos
          - path: /api/mail/
            pathType: Prefix
            backend:
              service:
                name: backend-mail-service
                port:
                  number: 8081
          # Frontend (todo lo demás)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
