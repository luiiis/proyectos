version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: proyecto-final-java-pg
    environment:
      POSTGRES_DB: empresa_db
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: proyecto-final-java-redis
    ports:
      - "6379:6379"

  app:
    build:
      context: ./app
    container_name: proyecto-final-java-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/empresa_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: miClaveSecretaParaJWT2026MuyLargaYSegura
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
