server:
  port: 8080

spring:
  application:
    name: java-learning-app

  # H2 por defecto (para que funcione sin PostgreSQL externo)
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

---
# Profile: postgres (activar con --spring.profiles.active=postgres)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/springboot_db
    username: postgres
    password: postgres123
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
