<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body { font-family: system-ui; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a237e; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #1a237e; margin-bottom: 24px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #1a237e; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 16px; }
        button:hover { background: #3949ab; }
        .error { color: #f44336; text-align: center; font-size: 14px; }
        .success { color: #4caf50; text-align: center; font-size: 14px; }
        .info { text-align: center; color: #666; font-size: 12px; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 Iniciar Sesión</h2>

        <!-- Mensaje de error -->
        <p th:if="${param.error}" class="error">❌ Usuario o contraseña incorrectos</p>
        <!-- Mensaje de logout -->
        <p th:if="${param.logout}" class="success">✅ Sesión cerrada correctamente</p>

        <!-- Formulario de login (Spring Security lo procesa automáticamente) -->
        <form th:action="@{/login}" method="post">
            <input type="text" name="username" placeholder="Usuario" required autofocus>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">Iniciar Sesión</button>
        </form>

        <div class="info">
            <p>Usuarios de prueba:</p>
            <p><strong>admin</strong> / Admin123! (rol ADMIN)</p>
            <p><strong>usuario</strong> / User123! (rol USER)</p>
        </div>
    </div>
</body>
</html>
