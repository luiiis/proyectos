services:
  mysql:
    image: mysql:8.0
    container_name: mini20-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Root123!
      MYSQL_DATABASE: import_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build: { context: ./backend, dockerfile: Dockerfile }
    container_name: mini20-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/import_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root123!
    ports:
      - "8080:8080"
    depends_on:
      mysql: { condition: service_healthy }
    networks:
      - app-network

networks:
  app-network:
