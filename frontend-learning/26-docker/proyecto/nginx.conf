server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA: todas las rutas devuelven index.html
    # Angular Router maneja la navegación en el cliente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets con hash (main.abc123.js)
    # Si el código cambia, el hash cambia → navegador descarga nuevo
    location ~* \.(js|css|png|jpg|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip para reducir tamaño de transferencia
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
}
