version: '3.9'

services:
  # ═══════════════════════════════════════════
  # PostgreSQL 16 - BD única para todo
  # ═══════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: fs2026-postgres
    environment:
      POSTGRES_DB: fullstack2026
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ═══════════════════════════════════════════
  # Redis 7 - Caché + Rate Limiting
  # ═══════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: fs2026-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-net
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ═══════════════════════════════════════════
  # Keycloak 25 - Identity Provider
  # ═══════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: fs2026-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/fullstack2026
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 8180
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin123}
    ports:
      - "8180:8180"
    command: start-dev --http-port=8180
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net

  # ═══════════════════════════════════════════
  # Backend - Spring Boot 3.3 + Java 25
  # ═══════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fs2026-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fullstack2026
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEYCLOAK_URL: http://keycloak:8180
      KEYCLOAK_REALM: fullstack
      CORS_ORIGINS: http://localhost:4200,http://localhost
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - app-net
    restart: unless-stopped

  # ═══════════════════════════════════════════
  # Frontend - Angular 21 + Nginx
  # ═══════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fs2026-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  app-net:
    driver: bridge
