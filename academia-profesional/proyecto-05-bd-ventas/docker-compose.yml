version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: ventas-postgres
    environment:
      POSTGRES_DB: ventas_db
      POSTGRES_PASSWORD: postgres123
    ports: ["5432:5432"]
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
  adminer:
    image: adminer
    container_name: ventas-adminer
    ports: ["8081:8080"]
