version: '3.9'

# Proyecto 15: Microservicios - 3 servicios + Gateway + Discovery
services:

  # ═══════ INFRAESTRUCTURA ═══════
  postgres-usuarios:
    image: postgres:16-alpine
    container_name: ms-postgres-usuarios
    environment: { POSTGRES_DB: usuarios_db, POSTGRES_PASSWORD: postgres123 }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 5 }

  postgres-productos:
    image: postgres:16-alpine
    container_name: ms-postgres-productos
    environment: { POSTGRES_DB: productos_db, POSTGRES_PASSWORD: postgres123 }
    ports: ["5433:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 5 }

  postgres-ventas:
    image: postgres:16-alpine
    container_name: ms-postgres-ventas
    environment: { POSTGRES_DB: ventas_db, POSTGRES_PASSWORD: postgres123 }
    ports: ["5434:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 5 }

  redis:
    image: redis:7-alpine
    container_name: ms-redis
    ports: ["6379:6379"]

  # ═══════ MICROSERVICIOS ═══════
  usuarios-service:
    build: ./usuarios-service
    container_name: ms-usuarios
    ports: ["8081:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-usuarios:5432/usuarios_db
      SPRING_DATASOURCE_PASSWORD: postgres123
    depends_on:
      postgres-usuarios: { condition: service_healthy }

  productos-service:
    build: ./productos-service
    container_name: ms-productos
    ports: ["8082:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-productos:5432/productos_db
      SPRING_DATASOURCE_PASSWORD: postgres123
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres-productos: { condition: service_healthy }

  ventas-service:
    build: ./ventas-service
    container_name: ms-ventas
    ports: ["8083:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ventas:5432/ventas_db
      SPRING_DATASOURCE_PASSWORD: postgres123
      PRODUCTOS_SERVICE_URL: http://productos-service:8080
      USUARIOS_SERVICE_URL: http://usuarios-service:8080
    depends_on:
      postgres-ventas: { condition: service_healthy }

  # ═══════ API GATEWAY ═══════
  gateway:
    build: ./gateway
    container_name: ms-gateway
    ports: ["8080:8080"]
    environment:
      USUARIOS_SERVICE_URL: http://usuarios-service:8080
      PRODUCTOS_SERVICE_URL: http://productos-service:8080
      VENTAS_SERVICE_URL: http://ventas-service:8080
    depends_on: [usuarios-service, productos-service, ventas-service]
