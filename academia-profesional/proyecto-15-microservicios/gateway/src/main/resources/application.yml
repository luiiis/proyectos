server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: usuarios-service
          uri: ${USUARIOS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/usuarios/**
        - id: productos-service
          uri: ${PRODUCTOS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/productos/**
        - id: ventas-service
          uri: ${VENTAS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/ventas/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
