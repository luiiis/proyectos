version: '3.9'

# Proyecto 17: Observabilidad - Prometheus + Grafana + App
services:
  app:
    build: ../proyecto-07-api-productos
    container_name: obs-app
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/productos_db
      SPRING_DATASOURCE_PASSWORD: postgres123

  postgres:
    image: postgres:16-alpine
    container_name: obs-postgres
    environment: { POSTGRES_DB: productos_db, POSTGRES_PASSWORD: postgres123 }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 5 }

  prometheus:
    image: prom/prometheus:latest
    container_name: obs-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=30d']

  grafana:
    image: grafana/grafana:latest
    container_name: obs-grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]

  alertmanager:
    image: prom/alertmanager:latest
    container_name: obs-alertmanager
    ports: ["9093:9093"]
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml

volumes:
  grafana_data:
