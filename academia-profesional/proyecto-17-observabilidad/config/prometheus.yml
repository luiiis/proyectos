# Prometheus: recolecta métricas cada 15 segundos
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Reglas de alerta
rule_files:
  - "alerts.yml"

# Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Targets: de dónde recolectar métricas
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['app:8080']
        labels:
          application: 'api-productos'
          environment: 'docker'
