# Alertmanager: qué hacer cuando una alerta se dispara
route:
  receiver: 'default'
  group_wait: 30s
  group_interval: 5m

receivers:
  - name: 'default'
    # En producción: configurar email, Slack, PagerDuty
    webhook_configs:
      - url: 'http://app:8080/api/alertas/webhook'
        send_resolved: true
