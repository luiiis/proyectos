version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ventas-fs-postgres
    environment:
      POSTGRES_DB: ventas_db
      POSTGRES_PASSWORD: postgres123
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ventas-fs-backend
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ventas_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      JWT_SECRET: claveSecretaVentas2026
    depends_on:
      postgres: { condition: service_healthy }

  frontend:
    build: ./frontend
    container_name: ventas-fs-frontend
    ports: ["80:80"]
    depends_on: [backend]

volumes:
  pg_data:
