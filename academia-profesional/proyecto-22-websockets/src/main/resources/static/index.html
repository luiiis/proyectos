<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Demo - Tiempo Real</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: system-ui; max-width: 900px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        .card { background: white; padding: 20px; border-radius: 8px; margin: 16px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .log { max-height: 300px; overflow-y: auto; background: #1a1a2e; color: #0f0; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 13px; }
        .log p { margin: 4px 0; }
        button { padding: 10px 20px; background: #1a237e; color: white; border: none; border-radius: 6px; cursor: pointer; margin: 4px; }
        button:hover { background: #3949ab; }
        .status { padding: 4px 12px; border-radius: 12px; font-size: 12px; }
        .connected { background: #4caf50; color: white; }
        .disconnected { background: #f44336; color: white; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 200px; }
    </style>
</head>
<body>
    <h1>🔌 WebSocket Demo - Notificaciones en Tiempo Real</h1>
    <p>Estado: <span id="status" class="status disconnected">Desconectado</span></p>

    <div class="card">
        <h3>Controles</h3>
        <button onclick="conectar()">Conectar WebSocket</button>
        <button onclick="desconectar()">Desconectar</button>
        <button onclick="simularVenta()">Simular Venta</button>
        <button onclick="simularAlerta()">Simular Alerta</button>
    </div>

    <div class="card">
        <h3>Chat (WebSocket bidireccional)</h3>
        <input id="chatInput" placeholder="Escribe un mensaje..." onkeyup="if(event.key==='Enter')enviarChat()">
        <button onclick="enviarChat()">Enviar</button>
    </div>

    <div class="card">
        <h3>📡 Mensajes Recibidos (tiempo real)</h3>
        <div id="log" class="log">
            <p>Esperando conexion...</p>
        </div>
    </div>

    <script>
        let stompClient = null;

        function conectar() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; // Silenciar logs de STOMP

            stompClient.connect({}, function() {
                document.getElementById('status').textContent = 'Conectado';
                document.getElementById('status').className = 'status connected';
                log('✓ Conectado al WebSocket');

                // Suscribirse a ventas
                stompClient.subscribe('/topic/ventas', function(msg) {
                    const venta = JSON.parse(msg.body);
                    log(`🛒 VENTA: ${venta.producto || 'Producto'} - $${venta.total} [${venta.timestamp}]`);
                });

                // Suscribirse a alertas
                stompClient.subscribe('/topic/alertas', function(msg) {
                    const alerta = JSON.parse(msg.body);
                    log(`⚠️ ALERTA: ${alerta.mensaje} [${alerta.tipo}]`);
                });

                // Suscribirse a chat
                stompClient.subscribe('/topic/chat', function(msg) {
                    const chat = JSON.parse(msg.body);
                    log(`💬 ${chat.usuario}: ${chat.texto}`);
                });
            });
        }

        function desconectar() {
            if (stompClient) stompClient.disconnect();
            document.getElementById('status').textContent = 'Desconectado';
            document.getElementById('status').className = 'status disconnected';
            log('✗ Desconectado');
        }

        function simularVenta() {
            fetch('/api/ventas/registrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ producto: 'Laptop HP', total: 18999.99, cliente: 'Carlos' })
            });
        }

        function simularAlerta() {
            fetch('/api/notificar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mensaje: 'Stock bajo: Laptop HP (3 unidades)' })
            });
        }

        function enviarChat() {
            const input = document.getElementById('chatInput');
            if (stompClient && input.value) {
                stompClient.send('/app/chat', {}, JSON.stringify({ usuario: 'Usuario', texto: input.value }));
                input.value = '';
            }
        }

        function log(msg) {
            const div = document.getElementById('log');
            div.innerHTML += `<p>${new Date().toLocaleTimeString()} - ${msg}</p>`;
            div.scrollTop = div.scrollHeight;
        }
    </script>
</body>
</html>
