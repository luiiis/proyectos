server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:graphql_db
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
