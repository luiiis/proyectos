apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: academia
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              value: app_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-secrets, key: postgres-password }
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { memory: "256Mi", cpu: "250m" }
            limits: { memory: "512Mi", cpu: "500m" }
      volumes:
        - name: pg-data
          persistentVolumeClaim: { claimName: pg-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: academia
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-pvc
  namespace: academia
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
