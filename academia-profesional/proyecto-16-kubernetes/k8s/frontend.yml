apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: academia
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: academia/frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "128Mi", cpu: "200m" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: academia
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
  type: LoadBalancer
