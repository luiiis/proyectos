# ════════════════════════════════════════════════════════════════
# Proyecto 4: Configuración principal
# (Para los tests se usa application-test.yml)
# ════════════════════════════════════════════════════════════════

server:
  port: 8080

spring:
  application:
    name: api-productos-tests

  datasource:
    url: jdbc:mysql://localhost:3306/productos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Root123!
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.softwarelee.productos.model
