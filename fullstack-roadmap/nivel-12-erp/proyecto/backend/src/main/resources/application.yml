# ════════════════════════════════════════════════════════════════
# Proyecto 12: ERP Depósitos — Configuración
# ════════════════════════════════════════════════════════════════

server:
  port: 8080

spring:
  application:
    name: depositos-erp

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://localhost:3306/erp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Root123!}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.softwarelee.erp.domain.model

app:
  jwt:
    secret: ${JWT_SECRET:MiClaveSecretaSuperSeguraQueDebeSerDe256BitsMinimo123456789012345}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000

# Actuator (monitoreo)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
