# Nivel 12: ERP Profesional — Depósitos
# ════════════════════════════════════════════════════════════════

services:
  mysql:
    image: mysql:8.0
    container_name: n12-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Root123!}
      MYSQL_DATABASE: ${DB_NAME:-erp_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: n12-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-erp_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Root123!}
      APP_JWT_SECRET: ${JWT_SECRET:-MiClaveSecretaSuperSeguraQueDebeSerDe256BitsMinimo123456789012345}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: n12-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  mailhog:
    image: mailhog/mailhog
    container_name: n12-mailhog
    ports:
      - "8025:8025"
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge

# Acceder:
# App: http://localhost
# API: http://localhost:8080
# Swagger: http://localhost:8080/swagger-ui.html
# Correos: http://localhost:8025
