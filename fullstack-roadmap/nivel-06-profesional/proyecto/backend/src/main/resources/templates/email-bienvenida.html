<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background: #f8f9fa; padding: 30px; border-radius: 8px;">
        <h2 style="color: #333;">¡Bienvenido!</h2>
        <p>Hola <strong th:text="${nombre}">Usuario</strong>,</p>
        <p>Tu cuenta ha sido creada exitosamente.</p>
        <p>Ya puedes iniciar sesión y comenzar a usar la plataforma.</p>
        <div style="text-align: center; margin: 30px 0;">
            <a href="http://localhost:4200/login"
               style="background: #28a745; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; font-weight: bold;">
                Iniciar Sesión
            </a>
        </div>
        <hr style="border: 1px solid #eee;">
        <p style="color: #999; font-size: 12px;">Este es un correo automático, no responder.</p>
    </div>
</body>
</html>
