# ════════════════════════════════════════════════════════════════
# Proyecto 6: Funciones Profesionales
# ════════════════════════════════════════════════════════════════

server:
  port: 8080

spring:
  application:
    name: api-profesional

  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Root123!
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ═══ Configuración de Correo (SMTP Gmail) ═══
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:tu-correo@gmail.com}
    password: ${MAIL_PASSWORD:tu-app-password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  # ═══ Thymeleaf (plantillas de correo HTML) ═══
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.softwarelee.profesional.model

app:
  jwt:
    secret: MiClaveSecretaSuperSeguraQueDebeSerDe256BitsMinimo123456789012345
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  password-reset:
    token-expiration: 3600000  # 1 hora
  security:
    max-login-attempts: 5
    lock-duration: 1800000     # 30 minutos
