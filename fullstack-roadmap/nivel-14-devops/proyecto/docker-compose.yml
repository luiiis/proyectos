# ════════════════════════════════════════════════════════════════
# Docker Compose: Orquesta todos los servicios
# ════════════════════════════════════════════════════════════════

services:
  # Base de datos
  mysql:
    image: mysql:8.0
    container_name: erp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-Root123!}
      MYSQL_DATABASE: ${DB_NAME:-erp_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  # Backend (Spring Boot)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: erp-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-erp_db}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-Root123!}
      JWT_SECRET: ${JWT_SECRET:-MiClaveSecretaSuperSeguraQueDebeSerDe256BitsMinimo123456789012345}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - erp-network

  # Frontend (Angular + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: erp-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - erp-network

volumes:
  mysql_data:

networks:
  erp-network:
    driver: bridge
