# ════════════════════════════════════════════════════════════════
# Proyecto 5: Seguridad con JWT
# ════════════════════════════════════════════════════════════════

server:
  port: 8080

spring:
  application:
    name: api-auth

  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Root123!
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.softwarelee.auth.model

# ═══ Configuración JWT ═══
app:
  jwt:
    secret: MiClaveSecretaSuperSeguraQueDebeSerDe256BitsMinimo123456789012345
    access-token-expiration: 900000      # 15 minutos en milisegundos
    refresh-token-expiration: 604800000  # 7 días en milisegundos
