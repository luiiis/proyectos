# ════════════════════════════════════════════════════════════════
# Proyecto 11: Sistema de Inventario
# ════════════════════════════════════════════════════════════════

server:
  port: 8080

spring:
  application:
    name: sistema-inventario

  datasource:
    url: jdbc:mysql://localhost:3306/inventario_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Root123!
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.softwarelee.inventario.model

app:
  jwt:
    secret: MiClaveSecretaSuperSeguraQueDebeSerDe256BitsMinimo123456789012345
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  stock:
    alerta-minimo: 5
